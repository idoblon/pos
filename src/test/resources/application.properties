# Test profile: boots the full Spring context against in-memory H2 (MySQL mode)
# so wiring errors surface in `mvnw test` without needing a running MySQL.
spring.application.name=POS-test

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:pos-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

jwt.secret=test-secret-key-for-unit-tests-0123456789abcdef0123456789abcdef

app.admin.email=admin@test.local
app.frontend-url=http://localhost:5173
app.payment.demo-mode=true
app.payment.success-url=http://localhost:3000/payment/success
app.payment.failure-url=http://localhost:3000/payment/failure
app.tax.rate=0.13

app.esewa.merchant-id=EPAYTEST
app.esewa.secret-key=dummy-secret
app.esewa.service-url=https://rc-epay.esewa.com.np/api/epay/main/v2/form
app.esewa.status-url=https://rc-epay.esewa.com.np/api/epay/transaction/status/

app.khalti.public-key=test_public_key
app.khalti.secret-key=test_secret_key
app.khalti.base-url=https://dev.khalti.com/api/v2

app.stripe.secret-key=sk_test_dummy
