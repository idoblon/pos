spring.application.name=POS
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway is prepared but disabled: the schema is still managed by ddl-auto.
# Read docs/MIGRATIONS.md before flipping this to true.
spring.flyway.enabled=false

# VAT applied to order subtotals as a decimal fraction (0.13 = 13%)
app.tax.rate=${APP_TAX_RATE:0.13}

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Server Configuration
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Admin Email Configuration
app.admin.email=${ADMIN_EMAIL:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.payment.demo-mode=${PAYMENT_DEMO_MODE:false}
# Bootstrap gate for open ROLE_ADMIN signup. Keep false in production; set true
# only for one-time local setup of the first admin account.
app.bootstrap.admin-signup=${ADMIN_SIGNUP_ENABLED:false}

# Payment Gateway Configuration
# eSewa UAT Test Credentials (https://developer.esewa.com.np/pages/Test-credentials)
app.esewa.merchant-id=${ESEWA_MERCHANT_ID:EPAYTEST}
app.esewa.secret-key=${ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}
app.esewa.service-url=${ESEWA_SERVICE_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
app.esewa.status-url=${ESEWA_STATUS_URL:https://rc-epay.esewa.com.np/api/epay/transaction/status/}

# Khalti Test Credentials (https://docs.khalti.com/khalti-epayment/)
app.khalti.public-key=${KHALTI_PUBLIC_KEY:test_public_key_dc74e0fd57cb46cd93832aee0a390234}
app.khalti.secret-key=${KHALTI_SECRET_KEY:test_secret_key_f59e8b7d18b4499ca40f68195a846e9b}
app.khalti.base-url=${KHALTI_BASE_URL:https://dev.khalti.com/api/v2}

# Stripe Test Credentials
app.stripe.secret-key=${STRIPE_SECRET_KEY}

# Payment Configuration
app.payment.success-url=${PAYMENT_SUCCESS_URL:http://localhost:3000/payment/success}
app.payment.failure-url=${PAYMENT_FAILURE_URL:http://localhost:3000/payment/failure}
app.payment.return-url=${PAYMENT_RETURN_URL:http://localhost:8080/api/public/payments/callback}
